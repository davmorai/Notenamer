[project]
name = "notenamer"
version = "0.1.0"
description = "Automatically writes note names into piano sheet music PDFs."
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "music21>=9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notenamer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
line-ending = "cr-lf"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
